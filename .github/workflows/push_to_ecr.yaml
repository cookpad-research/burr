on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      aws_account_id:
        required: true
        type: number
      aws_region:
        required: false
        type: string
        default: ap-northeast-1
      working_directory:
        description: Directory of project in this repo (should contain the helm/ sub-directory)
        required: true
        type: string
      image_name:
        description: Required if push_image is true
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ["ubuntu-latest"]
    # The job assumes the ECR push role through GitHub OIDC: no access key in the secrets.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install AWS CLI
        id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1.0.3
        with:
          version: 2
          verbose: false
          arch: amd64
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # Only jobs on this repository's main branch can assume it.
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/ActionsBurrTracker
          role-duration-seconds: 1200
          role-skip-session-tagging: true
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Build and push image
        working-directory: ${{ inputs.working_directory }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_APP_REPO: ${{ inputs.image_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          docker build -f s3_server_Dockerfile -t $ECR_REGISTRY/${{ inputs.env }}/${{ inputs.image_name }}:${{ inputs.image_name }}-$GIT_SHA-${{ github.run_id }}-${{ github.run_attempt }} .
          docker push $ECR_REGISTRY/${{ inputs.env }}/${{ inputs.image_name }}:${{ inputs.image_name }}-$GIT_SHA-${{ github.run_id }}-${{ github.run_attempt }}
